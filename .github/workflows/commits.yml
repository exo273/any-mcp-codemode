name: commits
on:
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate commit messages (docs/en/commits.md)
        run: python3 scripts/check_commit.py --range "origin/${{ github.base_ref }}..HEAD"
