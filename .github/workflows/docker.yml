name: docker
# Builds the multi-arch image from the release's static musl binaries (no Rust build, no QEMU compile).
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to package (e.g. v0.1.0)
        required: true

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

jobs:
  image:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      IMAGE: ghcr.io/${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - name: Fetch release binaries
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for pair in amd64:x86_64 arm64:aarch64; do
            arch=${pair%%:*}; triple=${pair##*:}-unknown-linux-musl
            gh release download "$TAG" -p "any-mcp-codemode-$triple.tar.xz" -D dl
            mkdir -p "ctx/linux/$arch"
            tar -xJf "dl/any-mcp-codemode-$triple.tar.xz" -C dl
            cp "dl/any-mcp-codemode-$triple/any-mcp-codemode" "ctx/linux/$arch/"
          done
          cp Dockerfile ctx/
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}},value=${{ env.TAG }}
            type=semver,pattern={{major}}.{{minor}},value=${{ env.TAG }}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.licenses=Apache-2.0 OR MIT
            io.modelcontextprotocol.server.name=io.github.exo273/any-mcp-codemode
      - id: push
        uses: docker/build-push-action@v6
        with:
          context: ctx
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
      - uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
