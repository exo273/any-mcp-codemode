name: publish-npm
# npm trusted publishing (OIDC): no token. Called by release.yml through cargo-dist's
# `publish-jobs = ["./publish-npm"]`. npm validates the *calling* workflow, so the trusted
# publisher on npmjs.com must name `release.yml`.
# https://docs.npmjs.com/trusted-publishers

on:
  workflow_call:
    inputs:
      plan:
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      PLAN: ${{ inputs.plan }}
    steps:
      - name: Fetch the npm package built by cargo-dist
        uses: actions/download-artifact@v8
        with:
          pattern: artifacts-*
          path: npm/
          merge-multiple: true
      # Trusted publishing needs npm >= 11.5.1 and Node >= 22.14.
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false
      - run: npm --version
      - name: npm publish (OIDC, provenance is automatic)
        run: |
          for release in $(echo "$PLAN" | jq --compact-output '.releases[] | select([.artifacts[] | endswith("-npm-package.tar.gz")] | any)'); do
            pkg=$(echo "$release" | jq '.artifacts[] | select(endswith("-npm-package.tar.gz"))' --raw-output)
            npm publish --access public "./npm/${pkg}"
          done
