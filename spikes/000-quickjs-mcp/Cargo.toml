[package]
name = "spike-000-quickjs-mcp"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
rmcp = { version = "=3.11.0", features = ["client", "server", "macros", "transport-child-process", "transport-io"] }
rquickjs = { version = "=0.14.0", default-features = false, features = ["futures"] }
tokio = { version = "1.54", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
