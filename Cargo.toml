[package]
name = "any-mcp-codemode"
version = "0.1.1"
edition = "2024"
rust-version = "1.94"
description = "Turn any MCP servers into one code-mode MCP server (QuickJS sandbox)"
license = "Apache-2.0 OR MIT"
authors = ["Raimundo Gonzalez <59464019+exo273@users.noreply.github.com>"]
repository = "https://github.com/exo273/any-mcp-codemode"
readme = "README.md"
keywords = ["mcp", "codemode", "llm", "agents", "quickjs"]
categories = ["command-line-utilities", "development-tools"]
include = ["src/**", "data/**", "migrations/**", "LICENSE-*", "README.md"]

[dependencies]
rmcp = { version = "3.11", default-features = false, features = ["client", "server", "transport-child-process", "transport-io", "transport-streamable-http-client-reqwest", "reqwest"] }
rquickjs = { version = "0.14", default-features = false, features = ["futures", "parallel"] }
tokio = { version = "1.54", features = ["rt-multi-thread", "macros", "time", "process", "io-std"] }
serde = { version = "1", features = ["derive"] }
http = "1"
serde_json = { version = "1", features = ["preserve_order"] }
sqlx = { version = "0.9.1", default-features = false, features = ["runtime-tokio", "any", "sqlite", "postgres", "migrate", "macros"] }
clap = { version = "4.6", features = ["derive", "env"] }
fluent-bundle = "0.16"
unic-langid = "0.9"
sys-locale = "0.3"
directories = "6"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3"
rmcp = { version = "3.11", default-features = false, features = ["client", "server", "macros", "transport-child-process", "transport-io"] }

[lints.rust]
unsafe_code = "forbid"
rust_2018_idioms = { level = "warn", priority = -1 }

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
dbg_macro = "warn"
print_stdout = "warn"
print_stderr = "warn"
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
too_many_lines = "allow" # the CLI dispatcher is one flat match on purpose

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"

# Used by cargo-dist release builds (dist-workspace.toml); same settings as `release`.
[profile.dist]
inherits = "release"
